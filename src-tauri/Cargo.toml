[package]
name = "alya"
version = "1.0.0"
description = "Alya：Windows 桌面 AI 翻译工具（DeepSeek 驱动）"
authors = ["Alya Team"]
edition = "2021"

# 依赖版本策略（spec 5.3）：初始化时锁定当时最新稳定版（写 major.minor，不写死 patch，
# 由 Cargo.lock 冻结）。明确不引入：tiny_http / updater / sql / store / fs-watch（spec 5.3 排除项）。

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# 应用框架（features 按需最小化；T15 追加 tray-icon——spec 5.3「托盘菜单构建与状态同步」，
# 原生菜单/托盘图标/左键事件均由此 feature 提供（muda/tray-icon），无其他依赖可替代）
tauri = { version = "2.11", features = ["tray-icon"] }
# 插件：注册顺序见 src/lib.rs 顶部说明
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-single-instance = "2.4"
tauri-plugin-autostart = "2.5"
tauri-plugin-notification = "2.3"
tauri-plugin-log = "2.9"
# 系统能力
# 注：selection crate 已移除——其底层依赖 enigo，主 Agent 要求"enigo 不引入"，
# T6 改用 windows SendInput + arboard（见 implementation-report T6 节偏离说明）。
screenshots = "0.8" # 多显示器截屏（物理分辨率 RGBA 帧）
arboard = "3.6" # 剪贴板读写（备份/恢复/监听）
image = { version = "0.25", default-features = false, features = ["png"] } # 内存裁剪与 PNG 编码
winreg = "0.56" # 便携版 WebView2 存在性探测（T17）
# 网络（仅 sse.rs 与连接验证两处出站，INV-2）
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
# spec 5.3 清单未列但必需：tokio 1.52+ 已将 sync::CancellationToken 迁出至 tokio-util（本仓锁定的
# tokio 1.53.1 中 tokio::sync 已无该项——T8 编译实证）；spec 5.7.7 会话模型的取消令牌改由
# tokio 官方配套 util crate 提供（MIT，同 tokio 许可家族）。
tokio-util = "0.7"
# 序列化与错误建模
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22" # DPAPI 密文 base64 编码（T3，spec 5.7.8）+ 遮罩快照 data: URL 编码（T9）
log = "0.4" # 日志 facade（tauri-plugin-log 注册于 T1；spec 5.7.8 解密降级需记无值日志）
# T10 追加 windows-future：IAsyncOperation 的阻塞等待原语 Async::join（windows 0.62 不再内联
# 提供 blocking get，官方配套 future crate 与 windows 同依赖树；spec 5.3 清单补充，MIT）。
windows-future = "0.3"
# Windows 系统绑定（OCR/DPAPI/剪贴板序号/前台控制），features 见 spec 5.3。
# 注：LocalFree（释放 CryptProtectData 返回的 BLOB）位于 Win32_Foundation，已在清单内，无需追加 feature。
# T5 追加 Win32_System_DataExchange：GetClipboardSequenceNumber（spec 5.6.3 剪贴板序号轮询）。
# T6 追加 Win32_UI_Input_KeyboardAndMouse：SendInput 注入 Ctrl+C（取词；主 Agent 指定 feature 名
# 为 KeyboardAndGroup，windows 0.62.2 实际仅存在 KeyboardAndMouse，已按实际更名——见 T6 偏离说明）。
# T15 追加 Win32_System_Threading：OpenProcess + GetExitCodeProcess（D7 主实例 pid 存活校验，
# spec 5.7.9；STILL_ACTIVE 常量位于 Win32_Foundation，已随既有 feature 启用）。
windows = { version = "0.62", features = [
    "Media_Ocr",
    "Globalization",
    "Foundation",
    "Storage_Streams",
    "Graphics_Imaging",
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
] }

# 集成测试用 mock HTTP 服务（spec 验收标准 2：wiremock 模拟 OpenAI 兼容服务）
[dev-dependencies]
wiremock = "0.6"

# INV-6 门禁：发布路径禁止裸 unwrap / expect 吞错（G2 门禁，cargo clippy --all-targets -- -D warnings 全量生效）
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
